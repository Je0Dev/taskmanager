[project]
name = "task-manager"
version = "1.0.0"
description = "A modern GUI task manager with dependencies, tags, due dates, and JSON persistence"
requires-python = ">=3.10"
dependencies = ["nicegui>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["task_manager"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
packages = ["task_manager"]
check_untyped_defs = true
no_implicit_optional = true